name: Bug report
description: Report a reproducible problem in this repository
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not include secrets, personal data, production exports, or unredacted logs. Report suspected vulnerabilities privately according to the security policy.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
      placeholder: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that demonstrates the problem.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: What is the current operational impact?
      options:
        - Production unavailable or data at risk
        - Production degraded
        - Development or CI blocked
        - Limited or cosmetic impact
        - Unknown
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Environment and evidence
      description: Include relevant version, commit, environment, workflow or run ID, timestamp, and redacted logs.
      placeholder: Add sanitized diagnostic context here.
    validations:
      required: false
  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: Describe any workaround or mitigation already tested.
    validations:
      required: false
